# OSM Map Rendering Configuration
# Used by: navbuddy generate, navbuddy download-manifest --render-maps

map:
  width: 1280
  height: 800
  zoom: 18
  tile_url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

car_icon:
  type: sedan
  scale: 0.025

overlay:
  enabled: true
  scale: 1.4
  device_scale_factor: 1

polyline:
  step_color: "#4285F4"
  step_weight: 6
  step_opacity: 0.9
  route_color: "#999999"
  route_weight: 3
  route_opacity: 0.4
