# OSM Map Rendering Configuration
# Used by: navbuddy generate, navbuddy download-manifest --render-maps

map:
  width: 1280
  height: 800
  zoom: 19
  tile_url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

car_icon:
  type: sedan
  scale: 0.03

overlay:
  enabled: true
  scale: 1.6
  device_scale_factor: 1

polyline:
  step_color: "#4285F4"
  step_weight: 7
  step_opacity: 0.9
  route_color: "#90CAF9"
  route_weight: 5
  route_opacity: 0.55
